<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
      font-size: 12px;
      background: #050505;
      color: #e0e0e0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: rgba(0, 229, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-gray { background: #555; }
    .dot-amber { background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.5); }
    .dot-green { background: #00ff9d; box-shadow: 0 0 8px rgba(0, 255, 157, 0.5); }
    .dot-cyan  { background: #00e5ff; box-shadow: 0 0 8px rgba(0, 229, 255, 0.5); }
    .brand { font-size: 13px; font-weight: 700; color: #fafafa; }
    .brand-icon { color: #00e5ff; }
    .status-text { color: #71717a; font-size: 11px; margin-left: auto; }
    .content { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .lease-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 14px;
      display: none;
    }
    .lease-card.active { display: block; border-color: rgba(0, 255, 157, 0.2); }
    .lease-card.pending { display: block; border-color: rgba(0, 229, 255, 0.3); }
    .pending-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 2px 8px;
      border-radius: 99px;
      margin-bottom: 10px;
      color: #00e5ff;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.2);
    }
    .pending-badge.live {
      color: #00ff9d;
      background: rgba(0, 255, 157, 0.1);
      border: 1px solid rgba(0, 255, 157, 0.2);
    }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .detail-item { display: flex; flex-direction: column; gap: 2px; }
    .detail-label { font-size: 9px; font-weight: 600; color: #555; text-transform: uppercase; }
    .detail-value { font-size: 12px; font-weight: 500; color: #e0e0e0; }
    .detail-value.scope { color: #00e5ff; }
    .detail-value.agent { color: #fafafa; font-weight: 600; }
    .reason {
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.5;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 4px;
      border-left: 2px solid rgba(0, 229, 255, 0.3);
      margin-bottom: 10px;
    }
    .countdown-value {
      font-size: 20px;
      font-weight: 700;
      color: #00ff9d;
      text-shadow: 0 0 10px rgba(0, 255, 157, 0.3);
    }
    .countdown-value.warning { color: #ff2a6d; }
    .progress-bar { height: 2px; background: rgba(255, 255, 255, 0.05); border-radius: 1px; overflow: hidden; margin-bottom: 10px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff9d, #00e5ff); transition: width 1s linear; }
    .btn-row { display: flex; gap: 8px; }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-approve { background: rgba(0, 255, 157, 0.15); color: #00ff9d; border: 1px solid rgba(0, 255, 157, 0.3); }
    .btn-approve:hover { background: rgba(0, 255, 157, 0.25); }
    .btn-deny { background: rgba(255, 42, 109, 0.15); color: #ff2a6d; border: 1px solid rgba(255, 42, 109, 0.3); }
    .btn-deny:hover { background: rgba(255, 42, 109, 0.25); }
    .btn-disconnect { width: 100%; background: rgba(255, 255, 255, 0.03); color: #71717a; border: 1px solid rgba(255, 255, 255, 0.06); font-size: 11px; padding: 8px; }
    .empty-state { text-align: center; color: #555; padding: 20px 0; font-size: 11px; }
    .empty-state .icon { font-size: 24px; margin-bottom: 8px; opacity: 0.3; }
  </style>
</head>
<body>
  <div class="header">
    <span class="dot" id="dot"></span>
    <span class="brand"><span class="brand-icon">&#9889;</span> AgentPing</span>
    <span class="status-text" id="status">Checking...</span>
  </div>
  <div class="content">
    <div class="lease-card" id="pending-section">
      <div class="pending-badge">Lease Request</div>
      <div class="detail-grid">
        <div class="detail-item"><span class="detail-label">Agent</span><span class="detail-value agent" id="pending-agent">--</span></div>
        <div class="detail-item"><span class="detail-label">Scope</span><span class="detail-value scope" id="pending-scope">--</span></div>
        <div class="detail-item"><span class="detail-label">Duration</span><span class="detail-value" id="pending-ttl">--</span></div>
        <div class="detail-item"><span class="detail-label">Agent ID</span><span class="detail-value" id="pending-agent-id" style="font-size:10px;color:#71717a;">--</span></div>
      </div>
      <div class="reason" id="pending-reason">--</div>
      <div class="btn-row">
        <button class="btn btn-approve" id="btn-approve">&#10003; Grant</button>
        <button class="btn btn-deny" id="btn-deny">&#10007; Deny</button>
      </div>
    </div>
    <div class="lease-card" id="lease-section">
      <div class="pending-badge live">Active</div>
      <div class="detail-grid">
        <div class="detail-item"><span class="detail-label">Scope</span><span class="detail-value scope" id="lease-scopes">--</span></div>
        <div class="detail-item"><span class="detail-label">Remaining</span><span class="countdown-value" id="lease-countdown">--</span></div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="lease-progress" style="width:100%"></div></div>
    </div>
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="icon">&#128173;</div>
      Waiting for agent pings...
    </div>
    <button class="btn btn-disconnect" id="btn-disconnect" style="display:none">Disconnect</button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
