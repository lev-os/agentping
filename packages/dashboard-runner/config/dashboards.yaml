dashboards:
  - name: AgentPing Storybook
    id: agentping
    port: 6006
    port_range:
      - 6006
      - 6010
    command: pnpm exec storybook dev --port {port}
    cwd: ~/digital/leviathan/community/agentping/packages/studio
    health_check:
      type: http
      path: /
      timeout_ms: 5000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: true
      max_retries: 5
      backoff_ms:
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
