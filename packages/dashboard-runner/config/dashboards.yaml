dashboards:
  - name: AgentPing Storybook
    id: agentping-storybook
    port: 6007
    port_range:
      - 6007
      - 6011
    command: pnpm exec storybook dev -p {port} --no-open
    cwd: ~/digital/leviathan/community/agentping/packages/ui
    health_check:
      type: http
      path: /
      timeout_ms: 5000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: true
      max_retries: 5
      backoff_ms:
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
    metadata:
      lane: development
      openMode: external
      description: AgentPing storybook (packages/ui) — 376 stories, THE storybook for the project
  - name: AgentPing Web UI
    id: web-ui
    port: 5173
    port_range:
      - 5173
      - 5178
    command: pnpm exec vite --port {port}
    cwd: ~/digital/leviathan/community/agentping/packages/adapters/web-ui
    health_check:
      type: http
      path: /
      timeout_ms: 5000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: true
      max_retries: 5
      backoff_ms:
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
    metadata:
      lane: interaction
      openMode: external
      description: Browser interaction shell
  - name: Dashboard Manager UI
    id: dashboard-manager-ui
    port: 5175
    port_range:
      - 5175
      - 5182
    command: pnpm exec vite --port {port}
    cwd: ~/digital/leviathan/community/agentping/packages/dashboard-manager-ui
    health_check:
      type: http
      path: /
      timeout_ms: 5000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: true
      max_retries: 5
      backoff_ms:
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
    metadata:
      lane: development
      openMode: external
      description: Host control-plane UI
  - name: AgentPing Studio
    id: studio
    port: 5180
    port_range:
      - 5180
      - 5184
    command: pnpm exec vite --port {port}
    cwd: ~/digital/leviathan/community/agentping/packages/studio
    health_check:
      type: http
      path: /
      timeout_ms: 5000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: true
      max_retries: 5
      backoff_ms:
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
    metadata:
      lane: development
      openMode: external
      description: Studio Vite renderer (hot reload for Electron renderer dev)
  - name: AgentPing Studio App
    id: studio-app
    port: 0
    port_range:
      - 0
      - 0
    command: pnpm start
    cwd: ~/digital/leviathan/community/agentping
    health_check:
      type: build-and-exit
      timeout_ms: 60000
      interval_ms: 30000
    restart_policy:
      enabled: false
      max_retries: 1
      backoff_ms:
        - 5000
    metadata:
      lane: apps
      openMode: external
      description: AgentPing Studio Electron app (the canonical desktop GUI)
  - name: System Dashboard
    id: system-dashboard
    port: 5185
    port_range:
      - 5185
      - 5189
    command: pnpm run build && pnpm exec vite preview --host 127.0.0.1 --strictPort --port {port}
    cwd: ~/digital/leviathan/plugins/system-dashboard
    health_check:
      type: http
      path: /
      timeout_ms: 5000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: true
      max_retries: 5
      backoff_ms:
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
    metadata:
      lane: ops
      openMode: embed
      description: Primary Leviathan ops command-center surface
      primary: true
  - name: Frey Market
    id: frey-market
    port: 3100
    port_range:
      - 3100
      - 3104
    command: pnpm dev --port {port}
    cwd: ~/digital/leviathan/apps/frey-market
    health_check:
      type: http
      path: /
      timeout_ms: 10000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: true
      max_retries: 5
      backoff_ms:
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
    metadata:
      lane: apps
      openMode: external
      description: Frey Market (node/nextjs)
      runtime: node
      framework: nextjs
      packageManager: pnpm
      lifecycle: detected
  - name: Ai Devs
    id: ai-devs
    port: 0
    port_range:
      - 0
      - 0
    command: xcodebuild -project AIDevs.xcodeproj -scheme AIDevs -destination 'platform=iOS Simulator,name=iPhone 17 Pro' build
    cwd: ~/digital/leviathan/apps/ai-devs
    health_check:
      type: build-and-exit
      timeout_ms: 300000
      interval_ms: 30000
    restart_policy:
      enabled: false
      max_retries: 1
      backoff_ms:
        - 5000
    metadata:
      lane: apps
      openMode: simulator
      description: Ai Devs (swift/xcodegen)
      runtime: swift
      framework: xcodegen
      packageManager: xcode
      lifecycle: detected
  - name: Claw Tok
    id: claw-tok
    port: 0
    port_range:
      - 0
      - 0
    command: xcodebuild -project ClawTok.xcodeproj -scheme ClawTok -destination 'platform=iOS Simulator,name=iPhone 17 Pro' build
    cwd: ~/digital/leviathan/apps/claw-tok
    health_check:
      type: build-and-exit
      timeout_ms: 300000
      interval_ms: 30000
    restart_policy:
      enabled: false
      max_retries: 1
      backoff_ms:
        - 5000
    metadata:
      lane: apps
      openMode: simulator
      description: Claw Tok (swift/xcodegen)
      runtime: swift
      framework: xcodegen
      packageManager: xcode
      lifecycle: detected
