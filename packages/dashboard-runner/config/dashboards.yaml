dashboards:
  - name: AgentPing Storybook
    id: agentping-storybook
    port: 6007
    port_range:
      - 6007
      - 6011
    command: pnpm exec storybook dev -p {port} --no-open
    cwd: "{project_root}/packages/ui"
    health_check:
      type: http
      path: /
      timeout_ms: 5000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: true
      max_retries: 5
      backoff_ms:
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
    metadata:
      lane: development
      openMode: external
      description: AgentPing storybook (packages/ui) — 376 stories, THE storybook for the project
  - name: AgentPing Web UI
    id: web-ui
    port: 5173
    port_range:
      - 5173
      - 5178
    command: pnpm exec vite --port {port}
    cwd: "{project_root}/packages/adapters/web-ui"
    health_check:
      type: http
      path: /
      timeout_ms: 5000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: true
      max_retries: 5
      backoff_ms:
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
    metadata:
      lane: interaction
      openMode: external
      description: Browser interaction shell
  - name: Dashboard Manager UI
    id: dashboard-manager-ui
    port: 5175
    port_range:
      - 5175
      - 5182
    command: pnpm exec vite --port {port}
    cwd: "{project_root}/packages/dashboard-manager-ui"
    health_check:
      type: http
      path: /
      timeout_ms: 5000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: true
      max_retries: 5
      backoff_ms:
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
    metadata:
      lane: development
      openMode: external
      description: Host control-plane UI
  - name: AgentPing Studio
    id: studio
    port: 5180
    port_range:
      - 5180
      - 5184
    command: pnpm exec vite --port {port}
    cwd: "{project_root}/packages/studio"
    health_check:
      type: http
      path: /
      timeout_ms: 5000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: true
      max_retries: 5
      backoff_ms:
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
    metadata:
      lane: development
      openMode: external
      description: Studio Vite renderer (hot reload for Electron renderer dev)
  - name: AgentPing Studio App
    id: studio-app
    port: 0
    port_range:
      - 0
      - 0
    command: pnpm start
    cwd: "{project_root}"
    health_check:
      type: build-and-exit
      timeout_ms: 60000
      interval_ms: 30000
    restart_policy:
      enabled: false
      max_retries: 1
      backoff_ms:
        - 5000
    metadata:
      lane: apps
      openMode: external
      description: AgentPing Studio Electron app (the canonical desktop GUI)
  # Host-workspace dashboards are optional integrations outside this AgentPing
  # repo. Set AGENTPING_HOST_ROOT to the host workspace root to enable them.
  - name: Dashboard
    id: dashboard
    port: 5185
    port_range:
      - 5185
      - 5189
    command: pnpm run build && pnpm exec vite preview --host 127.0.0.1 --strictPort --port {port}
    cwd: "{host_root}/plugins/dashboard"
    health_check:
      type: http
      path: /
      timeout_ms: 5000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: true
      max_retries: 5
      backoff_ms:
        - 1000
        - 2000
        - 4000
        - 8000
        - 16000
    metadata:
      lane: ops
      openMode: embed
      description: Primary Leviathan ops command-center surface
      primary: true
      host_workspace: true
  - name: Frey Market
    id: frey-market
    port: 3100
    port_range:
      - 3100
      - 3104
    command: pnpm dev --port {port}
    cwd: "{host_root}/apps/frey-market"
    health_check:
      type: http
      path: /
      timeout_ms: 10000
      expected_status: 200
      interval_ms: 10000
    restart_policy:
      enabled: false
      max_retries: 1
      backoff_ms:
        - 5000
    metadata:
      lane: apps
      openMode: external
      description: Frey Market (node/nextjs) — restart disabled, port 3100 conflict
      runtime: node
      framework: nextjs
      lifecycle: detected
      packageManager: pnpm
      host_workspace: true
  - name: Ai Devs
    id: ai-devs
    port: 0
    port_range:
      - 0
      - 0
    command: xcodebuild -project AIDevs.xcodeproj -scheme AIDevs -destination 'platform=iOS Simulator,name=iPhone 17 Pro' build
    cwd: "{host_root}/apps/ai-devs"
    health_check:
      type: build-and-exit
      timeout_ms: 300000
      interval_ms: 30000
    restart_policy:
      enabled: false
      max_retries: 1
      backoff_ms:
        - 5000
    metadata:
      lane: apps
      openMode: simulator
      description: Ai Devs (swift/xcodegen)
      runtime: swift
      framework: xcodegen
      packageManager: xcode
      lifecycle: detected
      host_workspace: true
  - name: Claw Tok
    id: claw-tok
    port: 0
    port_range:
      - 0
      - 0
    command: xcodebuild -project ClawTok.xcodeproj -scheme ClawTok -destination 'platform=iOS Simulator,name=iPhone 17 Pro' build
    cwd: "{host_root}/apps/claw-tok"
    health_check:
      type: build-and-exit
      timeout_ms: 300000
      interval_ms: 30000
    restart_policy:
      enabled: false
      max_retries: 1
      backoff_ms:
        - 5000
    metadata:
      lane: apps
      openMode: simulator
      description: Claw Tok (swift/xcodegen)
      runtime: swift
      framework: xcodegen
      packageManager: xcode
      lifecycle: detected
      host_workspace: true
  - name: Context Pack Viewer
    id: context-pack-viewer
    port: 0
    port_range:
      - 0
      - 0
    command: echo "external here.now page — open via URL"
    cwd: "{host_root}"
    health_check:
      type: process
      timeout_ms: 5000
      interval_ms: 60000
    restart_policy:
      enabled: false
      max_retries: 1
      backoff_ms:
        - 5000
    env:
      EXTERNAL_URL: "https://trusty-maple-wvcb.here.now/context-pack-viewer/"
    metadata:
      lane: ops
      openMode: embed
      description: "A0's L1-L2 graph projection — agents, workstreams, mail, parity"
      runtime: static
      framework: lev-now
      packageManager: none
      lifecycle: ready
      host_workspace: true
