# WebMCP Marketplace Index
# Catalog of available .webmcp.yaml tool definitions
# Each entry enables AI agents to interact with a website via structured tools
#
# Updated: 2026-04-10
# Skeletons removed during browser-cascade dead-code cleanup

version: "1.1"
updated_at: "2026-04-10"
total_entries: 4

entries:
  - name: chatgpt
    file: ../chatgpt.webmcp.yaml
    match: "https://chatgpt.com/*"
    tools: 6
    backend: manual
    status: verified
    category: ai-chat
    description: Control ChatGPT conversations — send messages, switch models, manage chats

  - name: exa-docs
    file: exa-docs.webmcp.yaml
    match: "https://docs.exa.ai/*"
    tools: 5
    backend: heuristic+manual
    status: verified
    category: api-docs
    description: Search and navigate Exa API documentation

  - name: substack
    file: substack-com.webmcp.yaml
    match: "https://substack.com/*"
    tools: 14
    backend: intent-webmcp
    status: generated+tested
    category: publishing
    description: Write posts, manage inbox, read feed, post notes on Substack

  - name: feedback-collector
    file: ../feedback-collector.webmcp.yaml
    match: "file://* | http://localhost:* | https://*.here.now/*"
    tools: 3
    backend: manual
    status: verified
    category: feedback
    description: Read, list, and clear feedback captured by lev-now feedback elements on /now pages
