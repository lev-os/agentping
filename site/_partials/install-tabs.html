<!-- PARTIAL: Tabbed Install Widget
     Drop into any CTA section. Pure CSS + vanilla JS, no dependencies.
     Package: @lev-os/leviathan -->

<div class="install-widget">
  <div class="install-tabs" role="tablist">
    <button class="install-tab active" data-cmd="npm i -g @lev-os/leviathan" role="tab" aria-selected="true">npm</button>
    <button class="install-tab" data-cmd="pnpm add -g @lev-os/leviathan" role="tab">pnpm</button>
    <button class="install-tab" data-cmd="brew install lev-os/tap/leviathan" role="tab">brew</button>
    <button class="install-tab" data-cmd="bun add -g @lev-os/leviathan" role="tab">bun</button>
    <button class="install-tab" data-cmd="npx @lev-os/leviathan" role="tab">npx</button>
    <button class="install-tab" data-cmd="curl -fsSL https://lev.dev/install.sh | bash" role="tab">curl</button>
  </div>
  <div class="install-code" role="tabpanel">
    <span class="dollar">$ </span><span class="install-cmd">npm i -g @lev-os/leviathan</span>
  </div>
</div>
